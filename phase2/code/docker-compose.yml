services:
  match-service:
    build: ./match-service
    volumes:
      - ./data/service_logs:/app/data/service_logs
    mem_limit: 160m
    cpus: 0.50
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  team-service:
    build: ./team-service
    volumes:
      - ./data/service_logs:/app/data/service_logs
    mem_limit: 160m
    cpus: 0.50
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  stadium-service:
    build: ./stadium-service
    volumes:
      - ./data/service_logs:/app/data/service_logs
    mem_limit: 160m
    cpus: 0.50
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    depends_on:
      match-service:
        condition: service_healthy
      team-service:
        condition: service_healthy
      stadium-service:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./data/nginx:/var/log/nginx
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
