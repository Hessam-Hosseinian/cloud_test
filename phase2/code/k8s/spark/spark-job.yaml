apiVersion: batch/v1
kind: Job
metadata:
  name: spark-streaming
  namespace: cc-project
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: spark-streaming
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 2000
      initContainers:
        - name: prepare-stream-folders
          image: busybox:1.36
          command: [sh, -ec]
          args:
            - |
              mkdir -p /project-data/data/stream/nginx \
                /project-data/data/stream/services \
                /project-data/checkpoints/spark-phase2
              find /project-data/data/stream/nginx -mindepth 1 -delete
              find /project-data/data/stream/services -mindepth 1 -delete
              find /project-data/checkpoints/spark-phase2 -mindepth 1 -delete
              chmod -R 0777 /project-data/data/stream /project-data/checkpoints
          volumeMounts:
            - {name: data, mountPath: /project-data}
      containers:
        - name: spark
          image: apache/spark:3.5.5
          imagePullPolicy: IfNotPresent
          command: [/opt/spark/bin/spark-submit]
          args:
            - --master
            - local[2]
            - --driver-memory
            - 768m
            - --conf
            - spark.sql.shuffle.partitions=2
            - /app/streaming_app.py
            - --nginx-input
            - /project-data/data/stream/nginx
            - --service-input
            - /project-data/data/stream/services
            - --checkpoint
            - /project-data/checkpoints/spark-phase2
            - --trigger-seconds
            - "5"
            - --run-seconds
            - "60"
          env:
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:ActiveProcessorCount=2 -Xss512k"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: OMP_NUM_THREADS, value: "1"}
            - {name: SPARK_LOCAL_IP, value: "127.0.0.1"}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1600Mi}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: data, mountPath: /project-data}
      volumes:
        - name: app
          configMap:
            name: spark-streaming-app
        - name: data
          persistentVolumeClaim:
            claimName: project-data
