apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-omnibus-config
  namespace: cc-project
data:
  omnibus.rb: |
    external_url 'http://gitlab.cc-project.svc'
    nginx['listen_port'] = 80
    nginx['listen_https'] = false
    gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
    gitlab_rails['time_zone'] = 'Asia/Tehran'
    puma['worker_processes'] = 0
    puma['min_threads'] = 1
    puma['max_threads'] = 2
    sidekiq['concurrency'] = 2
    postgresql['shared_buffers'] = '128MB'
    postgresql['work_mem'] = '8MB'
    prometheus_monitoring['enable'] = false
    alertmanager['enable'] = false
    node_exporter['enable'] = false
    redis_exporter['enable'] = false
    postgres_exporter['enable'] = false
    gitlab_exporter['enable'] = false
    gitlab_kas['enable'] = false
    registry['enable'] = false
    gitlab_rails['usage_ping_enabled'] = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: cc-project
  labels:
    app: gitlab
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:17.11.7-ce.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-bootstrap
                  key: initial-root-password
            - name: GITLAB_OMNIBUS_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: gitlab-omnibus-config
                  key: omnibus.rb
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 500m
              memory: 1500Mi
            limits:
              cpu: "2"
              memory: 3200Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - /opt/gitlab/embedded/bin/curl
                - --fail
                - --silent
                - http://127.0.0.1/-/readiness
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/opt/gitlab
            - name: logs
              mountPath: /var/log/gitlab
            - name: config
              mountPath: /etc/gitlab
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: logs
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: gitlab-config
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: cc-project
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30880
