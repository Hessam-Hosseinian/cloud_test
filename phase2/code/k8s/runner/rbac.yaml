apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: cc-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner
  namespace: cc-project
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/attach
      - pods/exec
      - pods/log
      - secrets
      - configmaps
      - services
      - persistentvolumeclaims
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, statefulsets/scale, replicasets]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner
  namespace: cc-project
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: cc-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cc-project-namespace-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [cc-project]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cc-project-namespace-reader
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: cc-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cc-project-namespace-reader
