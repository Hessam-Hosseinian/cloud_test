apiVersion: v1
kind: ConfigMap
metadata:
  name: report-web-conf
  namespace: cc-project
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /project-data/outputs/final;
      location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"report-web"}\n';
      }
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-web
  namespace: cc-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-web
  template:
    metadata:
      labels:
        app: report-web
    spec:
      containers:
        - name: web
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 20Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: data
              mountPath: /project-data
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: report-web-conf
        - name: data
          persistentVolumeClaim:
            claimName: project-data
---
apiVersion: v1
kind: Service
metadata:
  name: report-web
  namespace: cc-project
spec:
  type: NodePort
  selector:
    app: report-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30090
