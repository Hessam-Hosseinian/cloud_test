apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-conf
  namespace: cc-project
data:
  nginx.conf: |
    worker_processes 1;
    error_log /tmp/nginx-error.log warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/json;
      keepalive_timeout 30;
      upstream match_upstream { server match-service:8000; keepalive 16; }
      upstream team_upstream { server team-service:8000; keepalive 16; }
      upstream stadium_upstream { server stadium-service:8000; keepalive 16; }
      map $http_x_request_id $effective_request_id {
        default $http_x_request_id;
        "" $request_id;
      }
      map $http_x_client_country $effective_country {
        default $http_x_client_country;
        "" "unknown";
      }
      map $http_x_scenario $effective_scenario {
        default $http_x_scenario;
        "" "normal";
      }
      log_format json_logs escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$effective_request_id",'
        '"client_ip":"$remote_addr",'
        '"client_country":"$effective_country",'
        '"scenario":"$effective_scenario",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"service":"$target_service",'
        '"status_code":$status,'
        '"request_time_sec":"$request_time",'
        '"user_agent":"$http_user_agent"}';
      access_log /project-data/data/nginx/nginx_access.log json_logs buffer=64k flush=1s;
      server {
        listen 80;
        server_name _;
        set $target_service "unknown";
        location = /health {
          access_log off;
          return 200 '{"status":"ok","service":"nginx"}\n';
        }
        location /api/matches {
          set $target_service match-service;
          proxy_set_header X-Request-ID $effective_request_id;
          proxy_set_header X-Client-Country $effective_country;
          proxy_set_header X-Scenario $effective_scenario;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_pass http://match_upstream;
        }
        location /api/teams {
          set $target_service team-service;
          proxy_set_header X-Request-ID $effective_request_id;
          proxy_set_header X-Client-Country $effective_country;
          proxy_set_header X-Scenario $effective_scenario;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_pass http://team_upstream;
        }
        location /api/stadiums {
          set $target_service stadium-service;
          proxy_set_header X-Request-ID $effective_request_id;
          proxy_set_header X-Client-Country $effective_country;
          proxy_set_header X-Scenario $effective_scenario;
          proxy_set_header Host $host;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_pass http://stadium_upstream;
        }
        location / {
          return 404 '{"error":"route_not_found"}\n';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: cc-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      initContainers:
        - name: prepare-log-directory
          image: busybox:1.36
          command: [sh, -ec, "mkdir -p /project-data/data/nginx && chmod 0777 /project-data/data/nginx"]
          volumeMounts:
            - name: data
              mountPath: /project-data
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 80Mi
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: data
              mountPath: /project-data
      volumes:
        - name: config
          configMap:
            name: nginx-gateway-conf
        - name: data
          persistentVolumeClaim:
            claimName: project-data
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: cc-project
spec:
  type: NodePort
  selector:
    app: nginx-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
